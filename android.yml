# بناء تطبيق «دفتر العملاء» للأندرويد (مجاني على GitHub)
# التطبيق بيفتح نفس الموقع alshomrani-co.github.io/clientbook، فأي تحديث للموقع بيوصل للتطبيق لوحده
# وبيضيف: إرسال صورة الإعلان والكلام مع بعض لمحادثة العميل في واتساب مباشرة
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          mkdir app && cd app
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://alshomrani-co.github.io/clientbook/">' > www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.alshomrani.clientbook",
            "appName": "دفتر العملاء",
            "webDir": "www",
            "server": { "url": "https://alshomrani-co.github.io/clientbook/", "androidScheme": "https" },
            "android": { "useLegacyBridge": true, "backgroundColor": "#f4f2ee" }
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Manifest, version and icon
        run: |
          cd app/android
          python3 - <<'PY'
          import re
          p = 'app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'permission.INTERNET' not in s:
              s = s.replace('</manifest>', '    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>')
          # عشان التطبيق يقدر يشوف واتساب وواتساب بيزنس على أندرويد 11+
          s = s.replace('</manifest>', '    <queries>\n        <package android:name="com.whatsapp" />\n        <package android:name="com.whatsapp.w4b" />\n    </queries>\n</manifest>')
          open(p, 'w', encoding='utf-8').write(s)
          x = 'app/src/main/res/xml/file_paths.xml'
          t = open(x, encoding='utf-8').read()
          if 'cache-path' not in t:
              t = t.replace('</paths>', '    <cache-path name="cache" path="." />\n</paths>')
              open(x, 'w', encoding='utf-8').write(t)
          g = 'app/build.gradle'
          b = open(g, encoding='utf-8').read()
          b = re.sub(r'versionCode \d+', 'versionCode ${{ github.run_number }}', b)
          b = re.sub(r'versionName "[^"]*"', 'versionName "1.${{ github.run_number }}"', b)
          open(g, 'w', encoding='utf-8').write(b)
          PY
          rm -rf app/src/main/res/mipmap-anydpi-v26
          python3 -c "import PIL" 2>/dev/null || pip3 install --quiet --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image
          src = Image.open('../../logo-512.png').convert('RGBA')
          for n, px in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              im = src.resize((px, px), Image.LANCZOS)
              for f in ('ic_launcher', 'ic_launcher_round', 'ic_launcher_foreground'):
                  im.save('app/src/main/res/mipmap-%s/%s.png' % (n, f))
          PY

      - name: WhatsApp share plugin (image + text to one contact)
        run: |
          cd app/android/app/src/main/java/com/alshomrani/clientbook
          cat > MainActivity.java <<'JAVA'
          package com.alshomrani.clientbook;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(WaShare.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          cat > WaShare.java <<'JAVA'
          package com.alshomrani.clientbook;

          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.util.Base64;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;

          @CapacitorPlugin(name = "WaShare")
          public class WaShare extends Plugin {
              private boolean installed(String p) {
                  try { getContext().getPackageManager().getPackageInfo(p, 0); return true; }
                  catch (PackageManager.NameNotFoundException e) { return false; }
              }

              @PluginMethod
              public void status(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("wa", installed("com.whatsapp"));
                  r.put("w4b", installed("com.whatsapp.w4b"));
                  call.resolve(r);
              }

              @PluginMethod
              public void send(PluginCall call) {
                  String phone = call.getString("phone", "").replaceAll("[^0-9]", "");
                  String text = call.getString("text", "");
                  String img = call.getString("image", "");
                  String pkg = call.getString("pkg", "auto");
                  if (phone.isEmpty()) { call.reject("no phone"); return; }
                  if (pkg == null || pkg.equals("auto") || !installed(pkg)) {
                      pkg = installed("com.whatsapp") ? "com.whatsapp" : (installed("com.whatsapp.w4b") ? "com.whatsapp.w4b" : null);
                  }
                  if (pkg == null) { call.reject("واتساب مش متسطب على الجوال"); return; }
                  try {
                      Intent i = new Intent(Intent.ACTION_SEND);
                      i.setPackage(pkg);
                      i.putExtra("jid", phone + "@s.whatsapp.net");
                      if (text != null && !text.isEmpty()) i.putExtra(Intent.EXTRA_TEXT, text);
                      if (img != null && !img.isEmpty()) {
                          File dir = new File(getContext().getCacheDir(), "ads");
                          dir.mkdirs();
                          File f = new File(dir, "ad.jpg");
                          FileOutputStream out = new FileOutputStream(f);
                          out.write(Base64.decode(img, Base64.DEFAULT));
                          out.close();
                          Uri uri = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", f);
                          i.setType("image/jpeg");
                          i.putExtra(Intent.EXTRA_STREAM, uri);
                          i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      } else {
                          i.setType("text/plain");
                      }
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      JSObject r = new JSObject();
                      r.put("ok", true);
                      r.put("pkg", pkg);
                      call.resolve(r);
                  } catch (Exception e) {
                      call.reject("مقدرتش أفتح واتساب: " + e.getMessage());
                  }
              }
          }
          JAVA
          ls -la

      - name: Signing key (fixed, so updates install over the old app)
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../clientbook-shamrani.apk

      - uses: actions/upload-artifact@v4
        with:
          name: clientbook-shamrani-apk
          path: clientbook-shamrani.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Android ${{ github.run_number }}
          make_latest: true
          files: clientbook-shamrani.apk
          body: |
            ملف تطبيق «دفتر العملاء» للأندرويد.
            رابط التحميل الثابت: https://github.com/${{ github.repository }}/releases/latest/download/clientbook-shamrani.apk
